name: Build Achilles (zip automático)

# Sube el .zip del mod tal cual a la raíz del repositorio: este workflow lo descomprime y compila solo.
# Si en vez de un zip subes el proyecto ya descomprimido (con build.gradle en la raíz), también lo compila.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Descomprimir el zip del mod
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          # 1) el zip añadido o modificado en el último commit
          ZIP=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.zip' 2>/dev/null | tail -n 1 || true)
          # 2) si no hay, el último zip de la raíz por nombre
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 ./*.zip 2>/dev/null | sed 's|^\./||' | sort -V | tail -n 1 || true)
          fi
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Descomprimiendo: $ZIP"
            rm -rf _mod
            mkdir -p _mod
            unzip -q -o "$ZIP" -d _mod
            GRADLE_FILE=$(find _mod -maxdepth 3 -name build.gradle | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
            if [ -z "$GRADLE_FILE" ]; then
              echo "::error::El zip $ZIP no contiene build.gradle"
              exit 1
            fi
            ROOT=$(dirname "$GRADLE_FILE")
          elif [ -f build.gradle ]; then
            echo "Sin zip: se compila el proyecto de la raíz"
            ROOT=.
          else
            echo "::error::No hay ningún .zip del mod ni build.gradle en la raíz"
            exit 1
          fi
          echo "Proyecto en: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        working-directory: ${{ steps.prep.outputs.root }}
        run: gradle build --no-daemon

      - name: Verificar el JAR
        working-directory: ${{ steps.prep.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)
          test -n "$JAR"
          SIZE=$(stat -c%s "$JAR")
          echo "JAR: $JAR ($SIZE bytes)"
          test "$SIZE" -gt 10000
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'pack.mcmeta'

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ steps.prep.outputs.root }}/build/libs/*.jar
          if-no-files-found: error
